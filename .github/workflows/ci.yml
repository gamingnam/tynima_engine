name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layering:
    name: Layering check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/check_layering.py

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS (Apple Silicon)", os: macos-latest,   preset: ci-macos }
          - { name: "Windows (MSVC)",        os: windows-latest, preset: ci-windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      # The golden image renders, and the golden | render | heatmap strips
      # of any that differed: what to look at when that test fails here.
      - name: Golden renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: build/${{ matrix.preset }}/golden/
          if-no-files-found: ignore
